  <!-- Critical CSS for loading states -->
  <style>
    /* Critical loading styles */
    body {
      margin: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      color: #ffffff;
      overflow: hidden;
    }

    /* Loading screen */
    .orbital-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .orbital-logo {
      width: 80px;
      height: 80px;
      border: 3px solid transparent;
      border-top: 3px solid #00ff9f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .orbital-text {
      font-size: 24px;
      font-weight: 500;
      color: #00ff9f;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .orbital-subtitle {
      font-size: 14px;
      color: #888;
      text-align: center;
      max-width: 400px;
      line-height: 1.4;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading-dots {
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Hide loader when React app loads */
    #root:not(:empty) + .orbital-loader {
      opacity: 0;
      pointer-events: none;
    }

    /* WebGL context error styles */
    .webgl-error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      border-radius: 8px;
      padding: 20px;
      margin: 20px;
      color: #ff6b6b;
      text-align: center;
      max-width: 500px;
    }

    .webgl-error h3 {
      margin: 0 0 10px 0;
      color: #ff4757;
    }

    .webgl-error p {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
  
  <title>ORBITAL NEXUS - 3D Satellite Tracking Platform</title>

<body>
  <noscript>

      <p>Please enable JavaScript in your browser settings and reload the page.</p>

  <!-- Main React App Container -->
  <div id="root"></div>
  
  <!-- Loading Screen (shown until React loads) -->

    <div class="orbital-subtitle">
      Professional 3D Satellite Tracking Platform<br>
      <span class="loading-dots">Loading orbital mechanics engine...</span>
    </div>
  </div>

  <!-- WebGL Support Detection -->
  <script>
    // Detect WebGL support and show appropriate message
    function checkWebGLSupport() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        return !!gl;
      } catch (e) {
        return false;
      }
    }

    // Performance monitoring
    window.performanceMetrics = {
      startTime: Date.now(),
      webglSupported: checkWebGLSupport(),
      userAgent: navigator.userAgent,
      screenResolution: `${screen.width}x${screen.height}`,
      devicePixelRatio: window.devicePixelRatio || 1
    };

    // Global error handler for better debugging
    window.addEventListener('error', function(e) {
      console.error('🛰️ Global Error:', e.error);
      
      // Send error to monitoring service if available
      if (window.gtag) {
        gtag('event', 'exception', {
          description: e.error?.message || 'Unknown error',
          fatal: false
        });
      }
    });

    // WebGL context lost handler
    window.addEventListener('webglcontextlost', function(e) {
      console.warn('🛰️ WebGL context lost:', e);
      e.preventDefault();
      
      // Show user-friendly message
      const errorDiv = document.createElement('div');
      errorDiv.className = 'webgl-error';
      errorDiv.innerHTML = `
        <h3>⚠️ Graphics Context Lost</h3>
        <p>The 3D graphics context has been lost. This usually happens when:</p>
        <p>• Your GPU driver crashed or was reset</p>
        <p>• The browser ran out of graphics memory</p>
        <p>• You switched between applications</p>
        <p><strong>Please refresh the page to restore 3D visualization.</strong></p>
      `;
      document.body.appendChild(errorDiv);
    });

    // WebGL context restored handler
    window.addEventListener('webglcontextrestored', function(e) {
      console.log('🛰️ WebGL context restored:', e);
      
      // Remove error messages
      const errorDivs = document.querySelectorAll('.webgl-error');
      errorDivs.forEach(div => div.remove());
    });

    // Performance observer for monitoring
    if ('PerformanceObserver' in window) {
      const observer = new PerformanceObserver((list) => {
        const entries = list.getEntries();
        entries.forEach((entry) => {
          if (entry.entryType === 'navigation') {
            window.performanceMetrics.loadTime = entry.loadEventEnd - entry.loadEventStart;
          }
        });
      });
      observer.observe({ entryTypes: ['navigation'] });
    }

    // Dark mode preference detection
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark-mode-preferred');
    }

    // Reduced motion preference
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('reduced-motion');
    }

    // High contrast preference
    if (window.matchMedia && window.matchMedia('(prefers-contrast: high)').matches) {
      document.documentElement.classList.add('high-contrast');
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('🛰️ Service Worker registered:', registration.scope);
          })
          .catch(function(error) {
            console.log('🛰️ Service Worker registration failed:', error);
          });
      });
    }
  </script>
