<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        canvas { display: block; }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="status">Loading Three.js...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, cube, controls;
        
        function updateStatus(message) {
            document.getElementById('status').innerText = message;
        }
        
        function init() {
            updateStatus('Checking Three.js...');
            
            if (typeof THREE === 'undefined') {
                updateStatus('❌ Three.js failed to load');
                return;
            }
            
            updateStatus('✅ Three.js loaded, creating scene...');
            
            // Scene
            scene = new THREE.Scene();
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            // Renderer
            try {
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setClearColor(0x000011);
                document.body.appendChild(renderer.domElement);
                updateStatus('✅ WebGL renderer created');
            } catch (e) {
                updateStatus('❌ WebGL not supported: ' + e.message);
                return;
            }
            
            // Controls
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                updateStatus('✅ Orbit controls loaded');
            } else {
                updateStatus('⚠️ Orbit controls not loaded');
            }
            
            // Create a simple cube
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            // Add lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(1, 1, 1);
            scene.add(light);
            
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            // Add Earth
            const earthGeometry = new THREE.SphereGeometry(1, 32, 32);
            const earthMaterial = new THREE.MeshPhongMaterial({ color: 0x2233ff });
            const earth = new THREE.Mesh(earthGeometry, earthMaterial);
            earth.position.set(-3, 0, 0);
            scene.add(earth);
            
            updateStatus('✅ Scene created successfully! Spinning cube and Earth');
            
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate cube
            if (cube) {
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
            }
            
            // Update controls
            if (controls) controls.update();
            
            // Render
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }
        
        window.addEventListener('resize', onWindowResize);
        
        // Initialize when scripts are loaded
        window.addEventListener('load', function() {
            setTimeout(init, 100);
        });
        
        // Fallback initialization
        setTimeout(function() {
            if (typeof THREE !== 'undefined' && !renderer) {
                init();
            }
        }, 1000);
    </script>
</body>
</html>
